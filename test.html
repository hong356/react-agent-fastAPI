<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>流式对话测试</title>
</head>
<body>
    <textarea id="input" placeholder="输入问题" rows="4" style="width:600px"></textarea>
    <br/>
    <button onclick="sendChat()">发送</button>
    <div id="result" style="white-space: pre-wrap;margin-top:20px;width:600px;border:1px solid #ccc;padding:10px;min-height:300px"></div>

    <script>
        async function sendChat(){
            const text = document.getElementById("input").value;
            const resDom = document.getElementById("result");
            resDom.innerText = "";

            const response = await fetch("http://127.0.0.1:8000/stream_chat",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    question:text,
                    session_id:"user_001"
                })
            })
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while(true){
                const {done,value}=await reader.read();
                if(done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split("\n");
                for(let line of lines){
                    if(line.startsWith("data:")){
                        let data = line.replace("data:","");
                        if(data === "[DONE]") continue;
                        resDom.innerText += data;
                    }
                }
            }
        }
    </script>
</body>
</html>
